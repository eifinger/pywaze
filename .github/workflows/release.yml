---
name: Release

"on":
  release:
    types:
      - published

jobs:
  release_to_pypi:
    name: Release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pywaze/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Search and replace version
        run: |
          VERSION="${TAG_NAME//v/}"
          sed -i "s/1\.0+versionplaceholder\.1/$VERSION/" pyproject.toml
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build
        run: uv build
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish package distributions to PyPI
        run: uv publish
